<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container"></div>
    <h3>Customer Directory</h3>
    <br>
    <a th:href="@{/customers/createCustomer-form}" class="btn btn-primary btn-sm mb-3">
        Add Customer
    </a>
    <br>
    <table class="table table-bordered table-striped">
        <thead class="table-dark"></thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="tempCustomer : ${customers}">
                <td th:text="${tempCustomer.firstName}"></td>
                <td th:text="${tempCustomer.lastName}"></td>
                <td th:text="${tempCustomer.email}"></td>
                <td>
                    <a th:href="@{/customers/updateCustomer-form(customerId=${tempCustomer.id})}"
                        class="btn btn-info btn-sm">
                        Update
                    </a>
                    <a th:href="@{/customers/deleteCustomer(customerId=${tempCustomer.id})}"
                        class="btn btn-danger btn-sm"
                        onclick="if (!(confirm('Are you sure you want to delete this customer?'))) return false">
                        Delete
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
